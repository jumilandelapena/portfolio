name: Deploy

# Every push to main runs the same gates as CI. Only when they all pass is the
# site built again with the run's test summary and published to GitHub Pages,
# so the status panel on the page always describes the commit it belongs to.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: Lint, types, build, tests, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: No template leftovers
        run: |
          if git grep -i -E "bootstrapmade|snapfolio|alexander" -- . ":!.github/workflows"; then
            echo "::error::template leftovers found"; exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Playwright
        run: pnpm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Lighthouse CI
        run: pnpm lhci

      - name: Write test status
        run: pnpm status:write test-status/test-status.json

      - name: Upload test status
        uses: actions/upload-artifact@v7
        with:
          name: test-status
          path: test-status/test-status.json
          retention-days: 90

  deploy:
    name: Build with status and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Download test status
        uses: actions/download-artifact@v4
        with:
          name: test-status
          path: public

      - name: Build with the run summary
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

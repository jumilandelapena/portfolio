name: Update visual baselines

# Regenerates tests/visual/__screenshots__ on Linux (the same platform CI uses)
# and commits them to the branch the workflow was started from.

on:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CI: 'true'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build
        env:
          PORTFOLIO_SKIP_GITHUB: '1'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate baselines
        run: pnpm test:visual:update

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
          else
            git commit -m "test: update visual baselines"
            git push
          fi

name: Update visual baselines

# Regenerates tests/visual/__screenshots__ on Linux (the same runner and
# Chromium build CI compares on), commits them to the branch the workflow was
# started from, and uploads them as an artifact so a failed push is never a
# dead end.

on:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CI: 'true'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build
        env:
          PORTFOLIO_SKIP_GITHUB: '1'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate baselines
        run: pnpm test:visual:update

      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
          retention-days: 14

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git commit -m "test: update visual baselines"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          echo "::error::could not push the baselines; download the visual-baselines artifact instead"
          exit 1
